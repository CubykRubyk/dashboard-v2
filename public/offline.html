<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hors ligne — 2C Énergies</title>
    <style>
      /* Page servie par le service worker quand ni le réseau ni le cache n'ont la page demandée.
         Tout est en ligne : elle doit s'afficher sans aucune autre requête. */
      :root { color-scheme: light dark; }
      body {
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 24px;
        background: #f4f6fb;
        color: #2d2a3c;
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 340px;
        padding: 28px 24px;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 10px 30px rgb(45 42 60 / 10%);
      }
      img { width: 116px; height: auto; margin-bottom: 18px; }
      h1 { margin: 0 0 10px; font-size: 18px; }
      p { margin: 0; color: #6d7386; font-size: 14px; line-height: 1.5; }
      @media (prefers-color-scheme: dark) {
        body { background: #10131c; color: #eef1f8; }
        .card { background: #171b26; box-shadow: none; }
        p { color: #9aa1b4; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logo-2c-energies.png" alt="2C Énergies" />
      <h1>Vous êtes hors ligne</h1>
      <p>
        Cette page n’a pas encore été consultée sur cet appareil, elle n’a donc pas pu être
        enregistrée. Les écrans déjà ouverts restent accessibles.
      </p>
    </div>
  </body>
</html>
