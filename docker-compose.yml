services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dashboard:${POSTGRES_PASSWORD}@database:5432/dashboard?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      NODE_ENV: production
      TECHNICAL_DOCUMENT_STORAGE_ROOT: /app/data/pac-documents
      TECHNICAL_DOCUMENT_STORAGE_ROOT_REQUIRE_MOUNT: "true"
      DOCUMENT_TEMPLATE_STORAGE_ROOT: /app/data/document-templates
      DOCUMENT_TEMPLATE_STORAGE_ROOT_REQUIRE_MOUNT: "true"
      GENERATED_DOCUMENT_STORAGE_ROOT: /app/data/generated-documents
      GENERATED_DOCUMENT_STORAGE_ROOT_REQUIRE_MOUNT: "true"
      INTERVENTION_PHOTO_STORAGE_ROOT: /app/data/intervention-photos
      SAV_ATTACHMENT_STORAGE_ROOT: /app/data/sav-attachments
      DB_BACKUP_STORAGE_ROOT: /app/data/db-backups
      # Secret attendu par POST /api/cron/backup (sauvegarde planifiée). Sans lui, la route est
      # désactivée — le reste de l'application fonctionne normalement.
      CRON_SECRET: ${CRON_SECRET:-}
      # Les clés push (VAPID) et la configuration e-mail ne sont plus lues depuis l'environnement :
      # elles vivent chiffrées en base et se règlent dans Paramètres → Notifications.
    ports:
      - "3001:3000"
    volumes:
      - document_data:/app/data/pac-documents
      - document_templates_data:/app/data/document-templates
      - generated_documents_data:/app/data/generated-documents
      - intervention_photos_data:/app/data/intervention-photos
      - sav_attachments_data:/app/data/sav-attachments
      - db_backups_data:/app/data/db-backups
    networks: [backend]

volumes:
  postgres_data:
  document_data:
  document_templates_data:
  generated_documents_data:
  intervention_photos_data:
  sav_attachments_data:
  db_backups_data:

networks:
  backend:
