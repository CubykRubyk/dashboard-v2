services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dashboard:${POSTGRES_PASSWORD}@database:5432/dashboard?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      NODE_ENV: production
      TECHNICAL_DOCUMENT_STORAGE_ROOT: /app/data/pac-documents
      TECHNICAL_DOCUMENT_STORAGE_ROOT_REQUIRE_MOUNT: "true"
      DOCUMENT_TEMPLATE_STORAGE_ROOT: /app/data/document-templates
      DOCUMENT_TEMPLATE_STORAGE_ROOT_REQUIRE_MOUNT: "true"
      GENERATED_DOCUMENT_STORAGE_ROOT: /app/data/generated-documents
      GENERATED_DOCUMENT_STORAGE_ROOT_REQUIRE_MOUNT: "true"
    ports:
      - "3001:3000"
    volumes:
      - document_data:/app/data/pac-documents
      - document_templates_data:/app/data/document-templates
      - generated_documents_data:/app/data/generated-documents
    networks: [backend]

volumes:
  postgres_data:
  document_data:
  document_templates_data:
  generated_documents_data:

networks:
  backend:
